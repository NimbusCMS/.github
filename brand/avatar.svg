<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NimbusCMS">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#3b2a8c"/>
      <stop offset="0.55" stop-color="#241a5c"/>
      <stop offset="1"   stop-color="#160f3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.30" r="0.62">
      <stop offset="0" stop-color="#6d5efc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d5efc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="86"  cy="96"  r="3.4" opacity=".85"/>
    <circle cx="140" cy="52"  r="2.1" opacity=".55"/>
    <circle cx="428" cy="128" r="2.6" opacity=".70"/>
    <circle cx="462" cy="212" r="1.8" opacity=".45"/>
    <circle cx="60"  cy="238" r="2.2" opacity=".50"/>
    <circle cx="392" cy="430" r="2.4" opacity=".55"/>
    <circle cx="118" cy="440" r="1.9" opacity=".45"/>
    <circle cx="250" cy="66"  r="1.7" opacity=".40"/>
  </g>

  <!-- the broom, from the Nimbus admin mark (32x32 scaled 12x, centred) -->
  <g transform="translate(64 64) scale(12)" fill="none">
    <path d="M26 6.2 14.5 17.7" stroke="#f6d888" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M14.6 17.6c-1 .3-2.4 1-3.6 2.2-2.1 2.1-3.9 6.6-4.6 8.6-.2.5.3 1 .8.8 2-.7 6.5-2.5 8.6-4.6 1.2-1.2 1.9-2.6 2.2-3.6l-3.4-3.4Z" fill="#f0c24b"/>
    <path d="M8 22.5 5.4 28m5-3.6L8.7 29m4.6-3.2-1.4 3.8" stroke="#f6d888" stroke-width="0.9" stroke-linecap="round" opacity=".32"/>
    <path d="m24.5 11.5.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z" fill="#ffffff"/>
  </g>
</svg>
